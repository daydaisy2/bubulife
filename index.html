<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리 할 일</title>
<meta name="description" content="세은과 찬규의 오늘 할 일 — 두 사람 카드에 딱, 실시간으로 함께.">
<meta name="theme-color" content="#FBE049">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root{
    --yellow:#FBE049;
    --yellow-deep:#F7D83C;
    --white:#FFFFFF;
    --cream:#FDF8E7;
    --cream-line:#F3ECD6;
    --navy:#1E1B7A;
    --mint:#DFF2DD;
    --green:#2F6B33;
    --green-text:#3F7A46;
    --ink:#20201C;
    --muted:#8A8674;
    --pad: clamp(10px, 1.6vw, 26px);
    --gap: clamp(8px, 1.4vw, 20px);
    --radius: clamp(14px, 1.9vw, 24px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{
    background:var(--yellow);
    color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,"Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overscroll-behavior-y:contain;
  }
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  .hidden{display:none !important}

  /* ---------- app ---------- */
  #app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
       gap:clamp(8px,1.4vw,20px);padding:var(--pad)}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:clamp(1px,.5vw,6px) clamp(2px,.5vw,6px)}
  .top h1{margin:0;display:flex;align-items:center;gap:.22em;
          font-size:clamp(19px,3vw,34px);font-weight:900;letter-spacing:-.03em;line-height:1.1}
  .mark{width:1.04em;height:1.04em;border-radius:.3em;color:#fff;display:inline-grid;place-items:center;
        background:linear-gradient(#3DB552,#2C9B44);box-shadow:0 1px 3px rgba(60,50,0,.18)}
  .mark svg{width:72%;height:72%;display:block}
  .top-right{display:flex;align-items:center;gap:clamp(6px,.9vw,12px);flex:0 0 auto}
  .dot{width:clamp(6px,.8vw,10px);aspect-ratio:1;border-radius:50%;background:#B9B39A;opacity:.8;
       transition:background .3s}
  .dot.live{background:#2E9E52}
  .dot.warn{background:#D08A17}
  .dot.off{background:#A9A497}
  .pill{background:var(--white);border-radius:999px;font-weight:900;
        font-size:clamp(12.5px,1.75vw,20px);padding:clamp(7px,.95vw,13px) clamp(11px,1.4vw,20px);
        box-shadow:0 3px 10px rgba(112,86,0,.16);letter-spacing:-.02em;white-space:nowrap}
  .pill:active{transform:translateY(1px)}

  .board{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);align-items:start;flex:1 0 auto}

  /* ---------- card ---------- */
  .card{background:var(--white);border-radius:var(--radius);padding:clamp(8px,1.25vw,18px);
        box-shadow:0 8px 22px rgba(112,86,0,.13), 0 1px 0 rgba(255,255,255,.9) inset;
        display:flex;flex-direction:column;gap:clamp(6px,1vw,12px);min-width:0}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .who{display:flex;align-items:center;gap:clamp(5px,.75vw,10px);min-width:0}
  .avatar{display:grid;place-items:center;flex:0 0 auto;
          width:clamp(24px,3.2vw,42px);height:clamp(24px,3.2vw,42px);border-radius:50%;
          background:#F8E7D8;font-size:clamp(14px,1.85vw,25px);line-height:1}
  .card[data-owner="chankyu"] .avatar{background:#E6F0E2}
  .name{font-size:clamp(14px,2.05vw,26px);font-weight:900;letter-spacing:-.03em;white-space:nowrap;
        overflow:hidden;text-overflow:ellipsis}
  .ratio{font-size:clamp(12px,1.65vw,22px);font-weight:900;color:#5C5947;letter-spacing:-.02em;flex:0 0 auto}
  .bar{height:clamp(5px,.8vw,9px);border-radius:999px;background:#EDE9D8;overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:999px;background:var(--navy);
         transition:width .35s cubic-bezier(.2,.8,.2,1)}

  .rows{list-style:none;margin:0;padding:0;position:relative;
        display:flex;flex-direction:column;gap:clamp(5px,.75vw,10px);min-height:clamp(40px,5vw,64px)}
  .empty{margin:0;padding:clamp(10px,1.4vw,18px) 4px;color:var(--muted);
         font-size:clamp(12px,1.6vw,20px);font-weight:700;text-align:center}

  .row{display:flex;align-items:center;gap:clamp(5px,.8vw,12px);
       background:var(--cream);border-radius:clamp(9px,1.1vw,16px);
       padding:clamp(7px,.95vw,14px) clamp(8px,1vw,15px);
       min-height:clamp(44px,5.2vw,74px);
       transition:background .22s, transform .18s;
       will-change:transform;
       -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
       cursor:default}
  .row:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
  .row .ico{flex:0 0 auto;font-size:clamp(16px,2.4vw,30px);line-height:1}
  .row .txt{flex:1 1 auto;min-width:0;font-size:clamp(14px,2.15vw,27px);font-weight:900;
            letter-spacing:-.035em;line-height:1.2;
            display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
            overflow-wrap:anywhere;word-break:keep-all}
  .check{flex:0 0 auto;width:clamp(22px,3.1vw,34px);height:clamp(22px,3.1vw,34px);border-radius:50%;
         border:2px solid #E7E1CB;background:#fff;display:grid;place-items:center;
         transition:background .18s,border-color .18s,transform .12s}
  .check .tick{font-size:clamp(12px,1.75vw,20px);line-height:1;color:#fff;font-weight:900;opacity:0;transition:opacity .15s}
  .check:active{transform:scale(.92)}
  .row.done{background:var(--mint)}
  .row.done .txt{color:var(--green-text);text-decoration:line-through;text-decoration-color:#4E8B51;text-decoration-thickness:2px}
  .row.done .check{background:var(--green);border-color:var(--green)}
  .row.done .check .tick{opacity:1}
  .row.dragging{z-index:6;box-shadow:0 12px 26px rgba(60,50,0,.22);opacity:.97;transition:none}
  body.is-dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}
  body.is-dragging .row{transition:none}

  .card-add{align-self:flex-start;margin-top:clamp(1px,.4vw,4px);
            font-size:clamp(12px,1.55vw,19px);font-weight:900;color:#7A7561;letter-spacing:-.02em;
            padding:clamp(4px,.6vw,8px) clamp(6px,.8vw,12px);border-radius:999px;background:#FBF6E4}
  .card-add:active{background:#F5EFD9}

  /* ---------- add / edit sheet ---------- */
  .sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
  .sheet .bd{position:absolute;inset:0;background:rgba(60,48,0,.34);backdrop-filter:blur(2px);
             animation:fade .18s ease}
  .panel{position:relative;width:min(560px,100%);max-height:92vh;overflow:auto;
         background:#fff;border-radius:clamp(20px,3vw,28px) clamp(20px,3vw,28px) 0 0;
         padding:clamp(14px,2vw,22px) clamp(14px,2vw,22px) calc(clamp(14px,2vw,22px) + env(safe-area-inset-bottom));
         display:flex;flex-direction:column;gap:clamp(10px,1.4vw,16px);
         box-shadow:0 -8px 30px rgba(80,60,0,.18);animation:rise .22s cubic-bezier(.2,.8,.2,1)}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
  .grab{width:44px;height:5px;border-radius:999px;background:#E9E3CC;margin:-4px auto 0}
  .panel h2{margin:0;font-size:clamp(16px,2vw,22px);font-weight:900;letter-spacing:-.03em}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#F7F2DF;border-radius:14px;padding:5px}
  .seg button{padding:9px 6px;border-radius:11px;font-weight:900;font-size:clamp(13px,1.7vw,17px);color:#6E6A58}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(120,95,0,.12)}
  .emos{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
  .emos button{aspect-ratio:1;border-radius:11px;background:#FBF7E9;font-size:19px;line-height:1;
               display:grid;place-items:center}
  .emos button.on{background:var(--yellow);box-shadow:0 0 0 2px #E7C92F inset}
  #textInput{width:100%;padding:13px 14px;border-radius:14px;border:2px solid #EFEAD6;
             font-size:clamp(15px,2vw,19px);font-weight:800;letter-spacing:-.02em;color:var(--ink);background:#fff}
  #textInput:focus{outline:none;border-color:var(--navy)}
  .acts{display:flex;gap:8px;align-items:center}
  .acts .save{flex:1;background:var(--navy);color:#fff;border-radius:14px;padding:13px;font-weight:900;
              font-size:clamp(14px,1.9vw,18px);letter-spacing:-.02em}
  .acts .save:active{transform:translateY(1px)}
  .acts .del{color:#C0392B;font-weight:900;font-size:clamp(13px,1.7vw,16px);padding:12px 14px;border-radius:14px}

  /* ---------- gate ---------- */
  .gate{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px}
  .gate-card{background:#fff;border-radius:24px;padding:26px 22px;text-align:center;max-width:380px;
             box-shadow:0 12px 30px rgba(112,86,0,.16)}
  .gate-card .ge{font-size:40px;line-height:1}
  .gate-card h1{margin:8px 0 4px;font-size:22px;font-weight:900;letter-spacing:-.03em}
  .gate-card p{margin:0 0 16px;color:var(--muted);font-size:14px;font-weight:700}
  .gate-row{display:flex;gap:8px}
  .gate-row input{flex:1;min-width:0;padding:11px 12px;border-radius:12px;border:2px solid #EFEAD6;font:inherit;font-weight:700}
  .gate-row button{background:var(--navy);color:#fff;border-radius:12px;padding:0 16px;font-weight:900}

  /* ---------- toast ---------- */
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
         background:rgba(32,30,20,.92);color:#fff;padding:10px 16px;border-radius:999px;
         font-size:13.5px;font-weight:800;z-index:60;animation:fade .16s ease;white-space:nowrap;max-width:90vw;
         overflow:hidden;text-overflow:ellipsis}

  @media (max-width:430px){
    :root{--pad:10px;--gap:8px}
    .row{padding:8px 7px;min-height:50px;gap:5px}
    .row .txt{font-size:14.5px;line-height:1.22;-webkit-line-clamp:3}
    .row .ico{font-size:16px}
    .check{width:22px;height:22px;border-width:2px}
    .card{padding:8px 8px 9px;gap:6px;border-radius:16px}
    .avatar{width:27px;height:27px;font-size:15px}
    .name{font-size:15px}
    .ratio{font-size:13px}
    .top h1{font-size:20px}
    .pill{font-size:13px;padding:8px 12px}
    .emos{grid-template-columns:repeat(6,1fr)}
  }
  @media (max-width:340px){
    .row{padding:7px 6px;gap:4px}
    .row .txt{font-size:13.5px}
    .row .ico{font-size:15px}
    .check{width:21px;height:21px}
    .name{font-size:14px}
  }
  @media (min-width:900px){
    .row .txt{-webkit-line-clamp:2}
  }
</style>
</head>
<body>

<div id="gate" class="gate hidden">
  <div class="gate-card">
    <div class="ge">✅</div>
    <h1>우리 할 일</h1>
    <p>초대 링크로 들어오면 바로 시작할 수 있어요.</p>
    <div class="gate-row">
      <input id="roomInput" placeholder="방 코드" autocomplete="off" spellcheck="false">
      <button id="roomGo" type="button">들어가기</button>
    </div>
  </div>
</div>

<div id="app" class="app hidden">
  <header class="top">
    <h1><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.6 9.6 18.2 20 6.6"/></svg></span> 오늘 할 일</h1>
    <div class="top-right">
      <i id="dot" class="dot" title="연결 중"></i>
      <button id="addTop" class="pill" type="button">+ 추가</button>
    </div>
  </header>
  <main id="board" class="board"></main>
</div>

<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="bd" data-close="1"></div>
  <form id="form" class="panel" autocomplete="off">
    <div class="grab"></div>
    <h2 id="sheetTitle">할 일 추가</h2>
    <div class="seg" id="ownerSeg">
      <button type="button" data-owner="seeun">👩🏻 세은</button>
      <button type="button" data-owner="chankyu">👨🏻 찬규</button>
    </div>
    <div class="emos" id="emoPick"></div>
    <input id="textInput" type="text" placeholder="할 일을 입력해 주세요" maxlength="80" enterkeyhint="done">
    <div class="acts">
      <button type="button" id="delBtn" class="del hidden">삭제</button>
      <button type="submit" class="save">저장</button>
    </div>
  </form>
</div>

<script>
'use strict';
/* ============ 설정 ============ */
const DB = 'https://bubulife-678ac-default-rtdb.firebaseio.com';
const ROOM_RE = /^[A-Za-z0-9_-]{8,64}$/;
const OWNER = {
  seeun:   { name: '세은', emoji: '👩🏻' },
  chankyu: { name: '찬규', emoji: '👨🏻' }
};
const OWNER_ORDER = ['seeun', 'chankyu'];
const EMOJIS = ['🧺','🧹','🛒','🍳','🍽️','🧽','🚿','🪥','💊','🏃','🧘','📞','💌','📦','💰','✈️','💍','🌙','☀️','🐶','👕','🎁','📝','🚗'];

const params = new URLSearchParams(location.search);
let ROOM = (params.get('room') || '').trim();
if (!ROOM_RE.test(ROOM)) {
  const saved = localStorage.getItem('bubu.room') || '';
  ROOM = ROOM_RE.test(saved) ? saved : '';
}

const ST = { todos: {} };
let es = null, retry = 0, pollTimer = null, gotSnapshot = false;
let drag = null;
let draft = { id: null, owner: 'seeun', icon: '' };
let lastOwner = localStorage.getItem('bubu.owner') || 'seeun';
if (!OWNER[lastOwner]) lastOwner = 'seeun';

/* ============ 도우미 ============ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function objEntries(o) { return Object.entries(o || {}).filter(([, v]) => v && typeof v === 'object'); }
function todoList() { return objEntries(ST.todos).map(([id, t]) => ({ id, ...t })); }
function newId() { return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function toast(msg) {
  const old = $('.toast'); if (old) old.remove();
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.remove(), 2200);
}
function guessIcon(text) {
  const s = String(text || '');
  const map = [
    [/장보|마트|시장|구매|사기|사야/, '🛒'],
    [/청소|걸레|먼지|정리|빨래|세탁|설거지|분리수거|쓰레기/, '🧺'],
    [/요리|밥|식사|반찬|저녁|아침|점심/, '🍳'],
    [/예식|결혼|웨딩|본식|드레스|정장|청첩/, '💍'],
    [/여행|항공|비행|숙소|몰디브|짐/, '✈️'],
    [/돈|납부|카드|대출|보험|세금|월세|관리비/, '💰'],
    [/전화|연락|문의|예약/, '📞'],
    [/운동|헬스|산책|요가|스트레칭/, '🏃'],
    [/약|병원|치과|검진/, '💊'],
    [/잠|취침|수면/, '🌙'],
    [/씻|샤워|양치|세면/, '🚿'],
    [/차|주유|세차|정비|검사/, '🚗']
  ];
  for (const [re, em] of map) if (re.test(s)) return em;
  return '📝';
}
function iconFor(t) { return t.icon || guessIcon(t.text); }
function sortTodos(arr) {
  return arr.slice().sort((a, b) => {
    const ao = typeof a.order === 'number' ? a.order : Number.MAX_SAFE_INTEGER;
    const bo = typeof b.order === 'number' ? b.order : Number.MAX_SAFE_INTEGER;
    if (ao !== bo) return ao - bo;
    return (a.createdAt || 0) - (b.createdAt || 0);
  });
}
function mine(owner) {
  return sortTodos(todoList().filter(t => (OWNER[t.owner] ? t.owner : 'seeun') === owner));
}

/* ============ 그리기 ============ */
function rowHtml(t) {
  return '<li class="row' + (t.done ? ' done' : '') + '" data-id="' + esc(t.id) + '" tabindex="0">' +
    '<span class="ico">' + esc(iconFor(t)) + '</span>' +
    '<span class="txt">' + esc(t.text) + '</span>' +
    '<button class="check" type="button" data-id="' + esc(t.id) + '" aria-label="' +
      (t.done ? '완료 취소' : '완료') + '" aria-pressed="' + (t.done ? 'true' : 'false') + '">' +
      '<span class="tick">✓</span></button>' +
  '</li>';
}
function cardHtml(owner) {
  const info = OWNER[owner];
  const arr = mine(owner);
  const doneN = arr.filter(t => t.done).length;
  const pct = arr.length ? Math.round(doneN / arr.length * 100) : 0;
  return '<section class="card" data-owner="' + owner + '">' +
    '<div class="card-head">' +
      '<span class="who"><span class="avatar">' + info.emoji + '</span><span class="name">' + info.name + '</span></span>' +
      '<span class="ratio">' + doneN + '/' + arr.length + '</span>' +
    '</div>' +
    '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
    '<ul class="rows" data-owner="' + owner + '">' +
      (arr.length ? arr.map(rowHtml).join('') : '<li class="empty">아직 할 일이 없어요</li>') +
    '</ul>' +
    '<button class="card-add" type="button" data-owner="' + owner + '">+ 추가</button>' +
  '</section>';
}
function render() {
  if (drag && drag.active) { render.pending = true; return; }
  render.pending = false;
  $('#board').innerHTML = OWNER_ORDER.map(cardHtml).join('');
}
/* 다른 기기의 연속 업데이트(순서 바꾸기 등)는 한 번에 모은 뒤 그린다 */
let renderTimer = null;
function scheduleRender() {
  if (renderTimer) return;
  renderTimer = setTimeout(() => { renderTimer = null; render(); }, 80);
}

/* ============ Firebase 연결 ============ */
const roomUrl = () => DB + '/rooms/' + ROOM + '.json';
const nodeUrl = p => DB + '/rooms/' + ROOM + '/' + p + '.json';
function setLive(state) {
  const el = $('#dot'); if (!el) return;
  el.className = 'dot ' + state;
  el.title = state === 'live' ? '실시간 연결됨' : state === 'warn' ? '다시 연결 중' : state === 'off' ? '오프라인' : '연결 중';
}
function connect() {
  if (es) { try { es.close(); } catch (e) {} es = null; }
  setLive(retry ? 'warn' : 'connecting');
  try { es = new EventSource(roomUrl()); } catch (e) { setLive('off'); return; }

  es.addEventListener('put', ev => {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.path === '/' || m.path === '') {
      ST.todos = (m.data && m.data.todos) || {};
      gotSnapshot = true;
    } else setAt(m.path, m.data);
    retry = 0; setLive('live'); stopPolling(); scheduleRender();
  });
  es.addEventListener('patch', ev => {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    Object.entries(m.data || {}).forEach(([k, v]) => setAt((m.path === '/' ? '' : m.path) + '/' + k, v));
    gotSnapshot = true; setLive('live'); scheduleRender();
  });
  es.addEventListener('cancel', () => { setLive('warn'); reconnect(); });
  es.addEventListener('auth_revoked', () => { setLive('off'); });
  es.onopen = () => { retry = 0; setLive('live'); stopPolling(); if (!gotSnapshot) syncNow(true); };
  es.onerror = () => { setLive(navigator.onLine ? 'warn' : 'off'); reconnect(); startPolling(); };
}
function reconnect() {
  if (es) { try { es.close(); } catch (e) {} es = null; }
  retry = Math.min(retry + 1, 6);
  const wait = Math.min(1000 * Math.pow(1.7, retry), 15000);
  setTimeout(() => { if (!es) connect(); }, wait);
}
function setAt(path, data) {
  const segs = String(path).split('/').filter(Boolean);
  if (!segs.length) {
    ST.todos = (data && data.todos) || {};
    return;
  }
  let obj = ST;
  for (let i = 0; i < segs.length - 1; i++) {
    if (!obj[segs[i]] || typeof obj[segs[i]] !== 'object') obj[segs[i]] = {};
    obj = obj[segs[i]];
  }
  const last = segs[segs.length - 1];
  if (data === null || data === undefined) delete obj[last];
  else obj[last] = data;
}
function startPolling() {
  if (pollTimer) return;
  pollTimer = setInterval(() => { if (!es) syncNow(true); }, 8000);
}
function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
async function syncNow(quiet) {
  try {
    const r = await fetch(roomUrl(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = (await r.json()) || {};
    ST.todos = d.todos || {};
    gotSnapshot = true;
    if (!es) setLive('live');
    render(); stopPolling();
  } catch (e) {
    if (!quiet) toast('연결을 확인해 주세요');
    setLive(navigator.onLine ? 'warn' : 'off');
  }
}
async function put(path, val) {
  const r = await fetch(nodeUrl(path), { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(val) });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function patch(path, val) {
  const r = await fetch(nodeUrl(path), { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(val) });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function del(path) {
  const r = await fetch(nodeUrl(path), { method: 'DELETE' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return true;
}

/* ============ 체크 ============ */
async function toggle(id) {
  const t = ST.todos[id]; if (!t) return;
  const now = Date.now();
  const next = { done: !t.done, doneAt: !t.done ? now : null, updatedAt: now };
  t.done = next.done; t.doneAt = next.doneAt; t.updatedAt = now;
  render();
  try { await patch('todos/' + id, next); }
  catch (e) { t.done = !next.done; render(); toast('저장하지 못했어요'); }
}

/* ============ 추가 / 수정 시트 ============ */
function openSheet(id, owner) {
  draft = { id: id || null, owner: owner || lastOwner, icon: '' };
  const t = id ? ST.todos[id] : null;
  $('#sheetTitle').textContent = t ? '할 일 수정' : '할 일 추가';
  if (t) draft.owner = OWNER[t.owner] ? t.owner : 'seeun';
  draft.icon = t ? (t.icon || guessIcon(t.text)) : EMOJIS[0];
  $('#textInput').value = t ? t.text : '';
  $('#delBtn').classList.toggle('hidden', !t);
  paintSheet();
  $('#sheet').classList.remove('hidden');
  setTimeout(() => { if (!t) $('#textInput').focus(); }, 120);
}
function paintSheet() {
  $$('#ownerSeg button').forEach(b => b.classList.toggle('on', b.dataset.owner === draft.owner));
  $$('#emoPick button').forEach(b => b.classList.toggle('on', b.dataset.em === draft.icon));
}
function closeSheet() {
  $('#sheet').classList.add('hidden');
  $('#textInput').blur();
}
function nextOrder(owner) {
  const arr = mine(owner);
  return arr.length ? Math.max(...arr.map(t => typeof t.order === 'number' ? t.order : 0)) + 1 : 0;
}
async function saveTodo(e) {
  if (e) e.preventDefault();
  const text = $('#textInput').value.trim();
  if (!text) { $('#textInput').focus(); toast('할 일을 적어 주세요'); return; }
  const now = Date.now();
  if (draft.id) {
    const t = ST.todos[draft.id]; if (!t) return;
    const ownerChanged = (t.owner || 'seeun') !== draft.owner;
    const body = { text, icon: draft.icon, owner: draft.owner, updatedAt: now };
    if (ownerChanged) body.order = nextOrder(draft.owner);
    ST.todos[draft.id] = { ...t, ...body };
    closeSheet(); render();
    try { await patch('todos/' + draft.id, body); toast('수정했어요'); }
    catch (err) { toast('저장하지 못했어요'); }
  } else {
    const id = newId();
    const obj = {
      id, text, icon: draft.icon, owner: draft.owner, done: false,
      order: nextOrder(draft.owner), createdAt: now, updatedAt: now
    };
    ST.todos[id] = obj;
    lastOwner = draft.owner; localStorage.setItem('bubu.owner', lastOwner);
    closeSheet(); render();
    try { await put('todos/' + id, obj); toast('추가했어요'); }
    catch (err) { delete ST.todos[id]; render(); toast('저장하지 못했어요'); }
  }
}
async function deleteTodo() {
  const id = draft.id; if (!id) return;
  const t = ST.todos[id]; if (!t) { closeSheet(); return; }
  delete ST.todos[id];
  closeSheet(); render();
  try { await del('todos/' + id); toast('삭제했어요'); }
  catch (e) { ST.todos[id] = t; render(); toast('삭제하지 못했어요'); }
}

/* ============ 드래그로 순서 바꾸기 ============ */
const LONG_PRESS = 280;   /* 손가락: 길게 눌러 잡기 */
const MOUSE_HOLD = 90;    /* 마우스: 살짝 누르고 끌기 */
const MOVE_START = 7;     /* 이만큼 움직이면 스크롤이 아니라 드래그 */

function rowFrom(target) { return target.closest ? target.closest('.row') : null; }

function onDown(e) {
  const row = rowFrom(e.target);
  if (!row || drag) return;
  if (e.target.closest('.check') || e.target.closest('.card-add')) return;
  if (e.button !== undefined && e.button > 0) return;
  const id = row.dataset.id;
  if (!ST.todos[id]) return;
  const rect = row.getBoundingClientRect();
  drag = {
    id, row, owner: row.closest('.rows').dataset.owner,
    pointerId: e.pointerId, pointerType: e.pointerType || 'mouse',
    startX: e.clientX, startY: e.clientY, grabOffset: e.clientY - rect.top,
    active: false, moved: false, timer: null
  };
  try { row.setPointerCapture(e.pointerId); } catch (err) {}
  drag.timer = setTimeout(() => { if (drag && !drag.active) beginDrag(); },
    drag.pointerType === 'mouse' ? MOUSE_HOLD : LONG_PRESS);
}
function beginDrag() {
  if (!drag || drag.active) return;
  drag.active = true;
  drag.row.classList.add('dragging');
  document.body.classList.add('is-dragging');
  window.addEventListener('touchmove', blockScroll, { passive: false });
  if (navigator.vibrate) { try { navigator.vibrate(8); } catch (e) {} }
  paintDrag(drag.startY);
}
function blockScroll(e) { if (drag && drag.active) e.preventDefault(); }
function paintDrag(clientY) {
  drag.row.style.transform = 'translateY(' + (clientY - drag.grabOffset - drag.row.offsetTop) + 'px) scale(1.015)';
}
function onMove(e) {
  if (!drag || e.pointerId !== drag.pointerId) return;
  const dy = e.clientY - drag.startY, dx = e.clientX - drag.startX;
  if (!drag.active) {
    if (Math.abs(dy) > MOVE_START || Math.abs(dx) > MOVE_START * 2) {
      if (drag.pointerType === 'mouse') beginDrag();
      else { endDrag(false); return; }   /* 손가락이 먼저 움직이면 스크롤로 넘긴다 */
    } else return;
  }
  drag.moved = true;
  const list = drag.row.parentElement;
  const others = Array.from(list.querySelectorAll('.row')).filter(r => r !== drag.row);
  let before = null;
  for (const r of others) {
    const rc = r.getBoundingClientRect();
    if (e.clientY < rc.top + rc.height / 2) { before = r; break; }
  }
  if (before !== drag.row.nextElementSibling) list.insertBefore(drag.row, before);
  paintDrag(e.clientY);
}
function onUp(e) {
  if (!drag || (e && e.pointerId !== drag.pointerId)) return;
  const d = drag;
  const tapped = !d.active && !d.moved;
  endDrag(true);
  if (tapped) openSheet(d.id);
}
function endDrag(commit) {
  const d = drag; if (!d) return;
  clearTimeout(d.timer);
  window.removeEventListener('touchmove', blockScroll);
  drag = null;
  if (d.active) {
    d.row.classList.remove('dragging');
    d.row.style.transform = '';
    document.body.classList.remove('is-dragging');
  }
  if (d.active && d.moved && commit) saveOrder(d.owner);
  else if (render.pending) render();
}
function onCancel(e) {
  if (!drag || (e && e.pointerId !== drag.pointerId)) return;
  endDrag(false);
}
async function saveOrder(owner) {
  const list = $('.rows[data-owner="' + owner + '"]');
  if (!list) { render(); return; }
  const ids = Array.from(list.querySelectorAll('.row')).map(r => r.dataset.id);
  const jobs = [];
  ids.forEach((id, i) => {
    const t = ST.todos[id]; if (!t) return;
    if (t.order !== i) {
      t.order = i; t.updatedAt = Date.now();
      jobs.push(patch('todos/' + id, { order: i, updatedAt: t.updatedAt }));
    }
  });
  render();
  if (!jobs.length) return;
  try { await Promise.all(jobs); toast('순서를 저장했어요'); }
  catch (e) { toast('순서를 저장하지 못했어요'); }
}

/* ============ 이벤트 ============ */
function initApp() {
  /* 시트 안 이모지 */
  $('#emoPick').innerHTML = EMOJIS.map(em => '<button type="button" data-em="' + em + '">' + em + '</button>').join('');

  const board = $('#board');
  board.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove, { passive: false });
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onCancel);

  board.addEventListener('click', e => {
    const ck = e.target.closest('.check');
    if (ck) { e.preventDefault(); toggle(ck.dataset.id); return; }
    const add = e.target.closest('.card-add');
    if (add) { e.preventDefault(); openSheet(null, add.dataset.owner); return; }
  });
  board.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const row = e.target.closest('.row');
    if (!row || e.target.closest('.check')) return;
    e.preventDefault(); openSheet(row.dataset.id);
  });

  $('#addTop').addEventListener('click', () => openSheet(null, lastOwner));
  $('#delBtn').addEventListener('click', deleteTodo);
  $('#form').addEventListener('submit', saveTodo);
  $('#ownerSeg').addEventListener('click', e => {
    const b = e.target.closest('button[data-owner]'); if (!b) return;
    draft.owner = b.dataset.owner; paintSheet();
  });
  $('#emoPick').addEventListener('click', e => {
    const b = e.target.closest('button[data-em]'); if (!b) return;
    draft.icon = b.dataset.em; paintSheet();
  });
  $('#sheet').addEventListener('click', e => { if (e.target.dataset.close === '1') closeSheet(); });
  $('#textInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); saveTodo(); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

  $('#roomGo').addEventListener('click', joinRoom);
  $('#roomInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); joinRoom(); } });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { if (!es) syncNow(true); render(); }
  });

  registerSW();
}
function joinRoom() {
  const v = $('#roomInput').value.trim();
  if (!ROOM_RE.test(v)) { toast('방 코드를 확인해 주세요'); return; }
  location.search = '?room=' + encodeURIComponent(v);
}
function registerSW() {
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
}
function boot() {
  if (!ROOM) {
    $('#gate').classList.remove('hidden');
    $('#app').classList.add('hidden');
    initApp();
    return;
  }
  localStorage.setItem('bubu.room', ROOM);
  $('#gate').classList.add('hidden');
  $('#app').classList.remove('hidden');
  initApp();
  render();
  connect();
  setInterval(() => { if (!es) syncNow(true); }, 20000);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
