<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F5">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Bubulife · 우리 둘의 살림 노트</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bubulife">
<style>
:root{
  --bg:#FAF8F5; --bg-2:#F4F1EA; --card:#FFFFFF;
  --line:#E6E2D8; --line-soft:#EFEBE2;
  --ink:#1A1A1A; --ink-2:#5C5850; --muted:#8C877D;
  --seeun:#5A2DB5; --seeun-bg:#E7DEFF;
  --chankyu:#1F4FB0; --chankyu-bg:#D6EBFF;
  --both:#0E6B4E; --both-bg:#D3F3E5;
  --cream:#F1EBD6; --cream-ink:#6B5B2E;
  --danger:#B3261E; --danger-bg:#FBE9E7;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:15px;line-height:1.5;letter-spacing:-.1px;
  padding:calc(env(safe-area-inset-top) + 6px) 0 calc(104px + env(safe-area-inset-bottom));
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,p,ul,li{margin:0;padding:0}
ul{list-style:none}
.hidden{display:none !important}
.app{max-width:480px;margin:0 auto;padding:0 18px}

/* ---------- top ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:14px 2px 10px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand-mark{font-size:19px;line-height:1}
.brand h1{font-size:16px;font-weight:800;letter-spacing:-.3px;line-height:1.2}
.brand-sub{font-size:11.5px;color:var(--muted);margin-top:1px}
.top-actions{margin-left:auto;display:flex;gap:2px}
.icon-btn{
  width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  color:var(--muted);background:transparent;
}
.icon-btn.on{color:var(--ink);background:var(--bg-2)}
.icon-btn .slash{opacity:1;transition:opacity .15s}
.icon-btn.on .slash{opacity:0}

/* ---------- summary ---------- */
.hero{
  background:var(--bg-2);border-radius:var(--r);padding:16px 16px 14px;margin-bottom:16px;
}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hero-date{font-size:13.5px;font-weight:700;color:var(--ink-2)}
.conn{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--muted)}
.conn i{width:6px;height:6px;border-radius:50%;background:#C9C3B6;display:block}
.conn.live i{background:#2E9468}
.conn.warn i{background:#C08A2E}
.conn.off i{background:var(--danger)}
.hero-line{font-size:14px;color:var(--ink-2);margin-top:8px}
.hero-line b{color:var(--ink);font-weight:800}
.hero-events{margin-top:10px;display:flex;flex-direction:column;gap:7px}
.hev{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);min-width:0}
.hev i{width:5px;height:5px;border-radius:50%;flex:0 0 auto}
.hev b{font-weight:700;font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--muted);min-width:38px}
.hev span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;background:var(--bg-2);border-radius:14px;padding:4px;margin-bottom:16px}
.tab{
  flex:1;height:38px;border-radius:11px;font-size:13.5px;font-weight:700;color:var(--muted);
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.tab.is-on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(26,26,26,.06)}
.tab .n{font-size:11px;font-weight:700;color:var(--muted)}
.tab.is-on .n{color:var(--ink-2)}

/* ---------- filters ---------- */
.filters{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.chiprow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:700;
  color:var(--muted);background:transparent;min-height:32px;
}
.chip.on{background:var(--bg-2);color:var(--ink)}
.chip .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:middle}

/* ---------- list ---------- */
.list{display:flex;flex-direction:column;gap:9px}
.todo{
  display:flex;align-items:flex-start;gap:11px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:14px;
}
.todo.is-done{background:#FCFBF8;border-color:var(--line-soft)}
.todo.is-done .todo-title{text-decoration:line-through;color:var(--muted)}
.check{
  width:24px;height:24px;border-radius:50%;border:1.6px solid #D5CFC2;background:#fff;flex:0 0 auto;
  display:grid;place-items:center;color:#fff;margin-top:1px;
}
.check svg{opacity:0}
.todo.is-done .check{background:var(--ink);border-color:var(--ink)}
.todo.is-done .check svg{opacity:1}
.todo-main{flex:1;min-width:0}
.todo-title{font-size:14.5px;font-weight:700;word-break:keep-all;overflow-wrap:anywhere}
.todo-meta{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:7px}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;white-space:nowrap}
.tag.seeun{background:var(--seeun-bg);color:var(--seeun)}
.tag.chankyu{background:var(--chankyu-bg);color:var(--chankyu)}
.tag.both{background:var(--both-bg);color:var(--both)}
.tag.cat{background:var(--bg-2);color:#6B665D;font-weight:600}
.tag.due{background:var(--cream);color:var(--cream-ink)}
.tag.due.today{background:var(--ink);color:#fff}
.tag.due.late{background:var(--danger-bg);color:var(--danger)}
.todo-memo{font-size:12.5px;color:var(--muted);margin-top:8px;white-space:pre-wrap;word-break:break-word}
.star{width:30px;height:30px;flex:0 0 auto;color:#DAD4C6;font-size:15px;line-height:1;margin-top:-2px}
.star.on{color:#C99A2E}
.done-head{
  width:100%;display:flex;align-items:center;gap:8px;margin:18px 0 10px;
  font-size:12.5px;font-weight:700;color:var(--muted);padding:6px 2px;
}
.done-head .line{flex:1;height:1px;background:var(--line)}
.done-head .caret{transition:transform .15s;font-size:11px}
.done-head.open .caret{transform:rotate(180deg)}
.empty{
  text-align:center;padding:36px 18px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);color:var(--muted);font-size:13px;line-height:1.7;
}
.empty .big{display:block;font-size:22px;margin-bottom:9px}

/* ---------- calendar ---------- */
.cal-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.cal-nav{display:flex;align-items:center;gap:2px}
.cal-nav button{width:34px;height:34px;border-radius:10px;color:var(--ink-2);font-size:17px;display:grid;place-items:center}
.cal-nav button:active{background:var(--bg-2)}
#calTitle{font-size:15px;font-weight:800;letter-spacing:-.3px;padding:0 4px;white-space:nowrap}
.seg{display:flex;background:var(--bg-2);border-radius:11px;padding:3px;gap:2px}
.seg button{padding:5px 10px;border-radius:8px;font-size:12px;font-weight:700;color:var(--muted);min-height:28px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(26,26,26,.06)}

.month{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 8px 8px}
.wd-row{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:2px}
.wd-row span{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:2px 0}
.wd-row span:first-child{color:#B08A8A}
.wd-row span:last-child{color:#8A9DB3}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.cell{
  position:relative;aspect-ratio:1/0.95;border-radius:10px;display:flex;flex-direction:column;align-items:center;
  padding-top:6px;gap:3px;background:transparent;border:1px solid transparent;min-height:42px;justify-content:flex-start;
}
.cell .dnum{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink-2);line-height:1.15}
.cell.out .dnum{color:#C7C2B6}
.cell.today .dnum{background:var(--ink);color:#fff;width:21px;height:21px;border-radius:50%;display:grid;place-items:center;font-size:11px}
.cell.sel{background:var(--bg-2);border-color:var(--line)}
.cell.sun .dnum{color:#B08A8A}
.cell.sat .dnum{color:#8A9DB3}
.cell.today.sun .dnum,.cell.today.sat .dnum{color:#fff}
.cdots{display:flex;gap:2px;align-items:center;min-height:5px}
.cdots i{width:4.5px;height:4.5px;border-radius:50%;display:block}
.cdots i.more{width:auto;height:auto;background:none !important;font-size:8.5px;color:var(--muted);font-weight:700;line-height:1}
.tbar{width:12px;height:2px;border-radius:2px;background:#C9BFA6}
.legend{display:flex;gap:11px;justify-content:center;margin:12px 0 2px;font-size:11px;color:var(--muted);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:6px;height:6px;border-radius:50%;display:block}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 15px 13px;margin-top:12px}
.panel-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.panel-head b{font-size:14px;font-weight:800;letter-spacing:-.2px}
.pill{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--ink);color:#fff}
.sec-label{font-size:11px;font-weight:800;color:var(--muted);margin:12px 0 6px}
.sec-label:first-child{margin-top:0}
.ev{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--line-soft)}
.ev:first-of-type{border-top:0;padding-top:2px}
.ev-time{flex:0 0 auto;font-size:11.5px;font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:42px;padding-top:1px}
.ev-time.allday{color:var(--muted)}
.ev-body{flex:1;min-width:0}
.ev-title{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px;word-break:keep-all}
.ev-title i{width:6px;height:6px;border-radius:50%;flex:0 0 auto}
.ev-sub{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.empty-line{font-size:12.5px;color:#B4AEA2;padding:6px 0 2px}
.panel-actions{display:flex;gap:7px;margin-top:13px}
.ghost{
  flex:1;height:40px;border-radius:11px;border:1px solid var(--line);background:#fff;color:var(--ink-2);
  font-size:12.5px;font-weight:700;
}
.mini{display:flex;align-items:center;gap:9px;padding:8px 0;border-top:1px solid var(--line-soft)}
.mini:first-of-type{border-top:0}
.mini .mini-check{width:19px;height:19px;border-radius:50%;border:1.6px solid #D5CFC2;flex:0 0 auto;display:grid;place-items:center;color:#fff}
.mini.done .mini-check{background:var(--ink);border-color:var(--ink)}
.mini .mini-check svg{opacity:0}
.mini.done .mini-check svg{opacity:1}
.mini .mt{font-size:13px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini.done .mt{text-decoration:line-through;color:var(--muted)}

/* week */
.week{display:flex;flex-direction:column;gap:7px}
.wk{
  display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:12px 13px;text-align:left;width:100%;align-items:flex-start;min-height:56px;
}
.wk.today{border-color:#CFC8B8;background:#FFFDF8}
.wk-date{flex:0 0 auto;width:36px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:0;align-self:flex-start}
.wk-date .wd{font-size:10.5px;font-weight:700;color:var(--muted);line-height:1.3}
.wk-date .dn{font-size:16.5px;font-weight:800;letter-spacing:-.4px;font-variant-numeric:tabular-nums;line-height:1.3}
.wk.today .wk-date .dn{color:var(--ink)}
.wk.sun .wk-date .dn{color:#B08A8A}
.wk.sat .wk-date .dn{color:#8A9DB3}
.wk-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.wk-ev{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);min-width:0}
.wk-ev i{width:5px;height:5px;border-radius:50%;flex:0 0 auto}
.wk-ev .t{font-size:11px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;min-width:32px}
.wk-ev span.tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.wk-none{font-size:12px;color:#B4AEA2}
.wk-todo{font-size:11.5px;color:var(--cream-ink);font-weight:700}

.day-big{display:flex;align-items:flex-end;gap:9px;margin:2px 0 12px}
.day-big .dd{font-size:28px;font-weight:800;letter-spacing:-1px;line-height:1}
.day-big .dw{font-size:12.5px;font-weight:700;color:var(--muted);padding-bottom:3px}

/* ---------- net worth ---------- */
.nw-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px 16px}
.nw-eyebrow{font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.nw-amount{font-size:31px;font-weight:800;letter-spacing:-1.2px;line-height:1.2;margin-top:8px}
.nw-amount small{font-size:15px;font-weight:700;color:var(--ink-2);margin-left:3px;letter-spacing:0}
.nw-amount.neg{color:var(--danger)}
.nw-raw{font-size:12px;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}
.nw-split{display:flex;gap:8px;margin-top:15px}
.nw-split>div{flex:1;background:var(--bg-2);border-radius:12px;padding:10px 12px}
.nw-split span{display:block;font-size:11px;color:var(--muted);font-weight:700}
.nw-split b{font-size:14px;font-weight:800;letter-spacing:-.3px}
.nw-meta{display:flex;align-items:center;gap:6px;margin-top:13px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.nw-note{margin-top:10px;font-size:12.5px;color:var(--ink-2);background:var(--bg-2);border-radius:11px;padding:10px 12px;line-height:1.6}
.nw-actions{margin-top:14px}
.nw-btn{
  width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;
  font-size:13px;font-weight:700;color:var(--ink);
}
.nw-people{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.nw-person{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 13px 12px}
.nw-person .np-head{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.nw-person .np-name{font-size:11.5px;font-weight:800;padding:2.5px 8px;border-radius:7px}
.nw-person.seeun .np-name{background:var(--seeun-bg);color:var(--seeun)}
.nw-person.chankyu .np-name{background:var(--chankyu-bg);color:var(--chankyu)}
.nw-person .np-net{font-size:17px;font-weight:800;letter-spacing:-.4px;line-height:1.2}
.nw-person .np-net.neg{color:var(--danger)}
.nw-person .np-split{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.6;font-variant-numeric:tabular-nums}
.npf{background:var(--bg-2);border-radius:14px;padding:12px 12px 10px;margin-bottom:10px}
.npf-head{margin-bottom:8px}
.hist{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line-soft)}
.hist:first-of-type{border-top:0;padding-top:2px}
.hist .hm{width:70px;flex:0 0 auto;font-size:12px;font-weight:700;color:var(--ink-2)}
.hist .hwrap{flex:1;min-width:0;display:block}
.hist .hbar{display:block;height:8px;border-radius:4px;background:#EDE8DD;overflow:hidden}
.hist .hbar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#BDB199,#9E9074)}
.hist .hv{font-size:12.5px;font-weight:800;text-align:right;min-width:82px;font-variant-numeric:tabular-nums}
.hist .hd{font-size:10.5px;font-weight:700;color:var(--muted);text-align:right;width:52px;flex:0 0 auto}
.hist .hd.up{color:var(--both)}
.hist .hd.down{color:var(--danger)}

/* ---------- fab ---------- */
.fab{
  position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  width:calc(100% - 36px);max-width:444px;height:52px;border-radius:16px;
  background:var(--ink);color:#fff;font-size:14.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:7px;z-index:30;
  box-shadow:0 6px 18px rgba(26,26,26,.18);
}
.fab:active{transform:translateX(-50%) scale(.99)}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet-backdrop{position:absolute;inset:0;background:rgba(26,26,26,.36);animation:fade .18s ease}
.sheet-card{
  position:relative;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;overscroll-behavior:contain;
  background:#fff;border-radius:22px 22px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));
  animation:up .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes up{from{transform:translateY(22px)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.grip{width:36px;height:4px;border-radius:2px;background:var(--line);margin:2px auto 16px}
.sheet h2{font-size:16.5px;font-weight:800;letter-spacing:-.3px;margin-bottom:16px}
.field{margin-bottom:14px}
.field>label{display:block;font-size:11.5px;font-weight:800;color:var(--muted);margin-bottom:6px}
input[type=text],input[type=number],input[type=date],input[type=time],textarea{
  width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 13px;font-size:15px;
  outline:none;min-height:48px;
}
input:focus,textarea:focus,select:focus{border-color:#BDB6A6}
textarea{min-height:74px;resize:vertical}
input[type=date],input[type=time]{font-size:14px;padding:12px 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid2>*{min-width:0}
.owner-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.owner-seg button{
  height:46px;border-radius:12px;border:1px solid var(--line);background:#fff;
  font-size:13.5px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:5px;
}
.owner-seg button i{width:7px;height:7px;border-radius:50%;display:block}
.owner-seg button.on{border-color:transparent}
.owner-seg button.on[data-owner="seeun"]{background:var(--seeun-bg);color:var(--seeun)}
.owner-seg button.on[data-owner="chankyu"]{background:var(--chankyu-bg);color:var(--chankyu)}
.owner-seg button.on[data-owner="both"]{background:var(--both-bg);color:var(--both)}
.cat-seg{display:flex;flex-wrap:wrap;gap:6px}
.cat-seg button{height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.cat-seg button.on{background:var(--bg-2);border-color:transparent;color:var(--ink)}
.star-toggle{
  height:48px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:13.5px;font-weight:700;
  color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;overflow:hidden;width:100%;
}
.star-toggle.on{background:var(--cream);border-color:transparent;color:var(--cream-ink)}
.sheet-actions{display:flex;gap:8px;margin-top:20px}
.sheet-actions button{flex:1;height:52px;border-radius:14px;font-size:15px;font-weight:800}
.primary{background:var(--ink);color:#fff}
.danger{flex:0 0 auto !important;width:52px;background:var(--danger-bg);color:var(--danger);font-size:15px}
.checkline{display:flex;align-items:center;gap:9px;padding:10px 2px}
.checkline input{width:21px;height:21px;accent-color:var(--ink);margin:0}
.checkline label{font-size:13.5px;font-weight:700;color:var(--ink-2)}
.unit-seg{width:100%;display:grid;grid-template-columns:1fr 1fr}
.unit-seg button{padding:8px 0;min-height:36px}
.nw-calc{
  background:var(--bg-2);border-radius:12px;padding:12px 14px;font-size:13.5px;font-weight:700;color:var(--ink-2);line-height:1.7;
}
.nw-calc b{font-size:16px;font-weight:800;color:var(--ink)}
.nw-calc .sub{display:block;font-size:11.5px;font-weight:600;color:var(--muted)}

/* ---------- footer / gate / toast ---------- */
.foot{margin:24px 0 4px;text-align:center}
.foot-btns{display:flex;gap:8px;justify-content:center}
.foot-btns button{
  font-size:12px;font-weight:700;color:var(--ink-2);background:#fff;border:1px solid var(--line);
  border-radius:11px;padding:9px 14px;
}
.foot-note{font-size:11px;color:#B4AEA2;margin-top:14px;line-height:1.7}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 20px}
.gate-card{
  width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:20px;
  padding:30px 24px 26px;text-align:center;
}
.gate-icon{font-size:30px;margin-bottom:14px}
.gate h1{font-size:18px;font-weight:800;letter-spacing:-.3px;margin-bottom:9px}
.gate p{font-size:13.5px;color:var(--muted);line-height:1.75}
.gate code{background:var(--bg-2);border-radius:6px;padding:1px 6px;font-size:12px;color:var(--ink-2)}
.gate-note{margin-top:18px;font-size:11.5px;color:#B4AEA2;line-height:1.8;border-top:1px solid var(--line-soft);padding-top:16px}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(82px + env(safe-area-inset-bottom));z-index:90;
  background:rgba(26,26,26,.94);color:#fff;font-size:13px;font-weight:600;padding:11px 16px;border-radius:12px;
  max-width:80vw;text-align:center;animation:up .2s ease;
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>

<div id="gate" class="gate hidden">
  <div class="gate-card">
    <div class="gate-icon">🏡</div>
    <h1>초대 링크로 들어와 주세요</h1>
    <p>이 보드는 <b>비공개 방 링크</b>로만 열립니다.<br>가족에게 받은 링크(<code>?room=…</code>)를 그대로 열어 주세요.</p>
    <div class="gate-note">
      링크 하나로 두 사람이 같은 목록을 실시간으로 함께 봐요.<br>
      새 방은 자동으로 만들어지지 않습니다.
    </div>
  </div>
</div>

<div id="app" class="app hidden">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">🏡</span>
      <div>
        <h1>Bubulife</h1>
        <p class="brand-sub">우리 둘의 살림 노트</p>
      </div>
    </div>
    <div class="top-actions">
      <button id="notifyBtn" class="icon-btn" data-act="notify" aria-label="알림 켜기">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8.6a6 6 0 0 0-12 0c0 5.1-2 6.4-2 6.4h16s-2-1.3-2-6.4"/>
          <path d="M10.2 18.8a2.1 2.1 0 0 0 3.6 0"/>
          <path class="slash" d="M4.5 3.5l15 17"/>
        </svg>
      </button>
      <button id="installBtn" class="icon-btn hidden" data-act="install" aria-label="홈 화면에 추가">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 4v10"/><path d="M8 10.5l4 4 4-4"/><path d="M5 19h14"/>
        </svg>
      </button>
    </div>
  </header>

  <section class="hero">
    <div class="hero-top">
      <span id="todayLabel" class="hero-date">–</span>
      <span id="conn" class="conn"><i></i><span>연결 중</span></span>
    </div>
    <p class="hero-line" id="heroLine">–</p>
    <div id="heroEvents" class="hero-events"></div>
  </section>

  <nav class="tabs">
    <button class="tab is-on" data-act="view" data-view="todos">할 일 <span id="tabCount" class="n">0</span></button>
    <button class="tab" data-act="view" data-view="cal">캘린더</button>
    <button class="tab" data-act="view" data-view="nw">순자산</button>
  </nav>

  <main>
    <section id="view-todos" class="view">
      <div class="filters">
        <div class="chiprow" id="ownerFilter">
          <button class="chip on" data-act="filter-owner" data-owner="all">전체</button>
          <button class="chip" data-act="filter-owner" data-owner="seeun"><span class="dot" style="background:#9B7BE8"></span>세은</button>
          <button class="chip" data-act="filter-owner" data-owner="chankyu"><span class="dot" style="background:#6BA5E8"></span>찬규</button>
          <button class="chip" data-act="filter-owner" data-owner="both"><span class="dot" style="background:#4FBF95"></span>같이</button>
        </div>
        <div class="chiprow" id="statusFilter">
          <button class="chip on" data-act="filter-status" data-status="all">전체</button>
          <button class="chip" data-act="filter-status" data-status="active">할 일</button>
          <button class="chip" data-act="filter-status" data-status="done">완료</button>
        </div>
      </div>
      <ul id="todoActive" class="list"></ul>
      <div id="doneWrap">
        <button class="done-head" data-act="toggle-done-open" id="doneHead">
          <span>완료</span><span id="doneCount">0</span><span class="line"></span><span class="caret">▼</span>
        </button>
        <ul id="todoDone" class="list hidden"></ul>
      </div>
    </section>

    <section id="view-cal" class="view hidden">
      <div class="cal-top">
        <div class="cal-nav">
          <button data-act="cal-prev" aria-label="이전">‹</button>
          <b id="calTitle">–</b>
          <button data-act="cal-next" aria-label="다음">›</button>
        </div>
        <div class="seg" id="calMode">
          <button data-act="cal-mode" data-mode="month" class="on">월</button>
          <button data-act="cal-mode" data-mode="week">주</button>
          <button data-act="cal-mode" data-mode="day">일</button>
        </div>
      </div>
      <div id="calBody"></div>
      <div id="calPanel"></div>
    </section>

    <section id="view-nw" class="view hidden">
      <div id="nwBody"></div>
    </section>
  </main>

  <footer class="foot">
    <div class="foot-btns">
      <button data-act="copy-link">링크 복사</button>
      <button data-act="notify">알림 켜기</button>
    </div>
    <div class="foot-note">비공개 방 · 검색에 노출되지 않아요</div>
  </footer>
</div>

<button id="fab" class="fab hidden" data-act="fab">＋ 할 일 추가</button>

<div id="sheet" class="sheet hidden">
  <div class="sheet-backdrop" data-act="close-sheet"></div>
  <div class="sheet-card" id="sheetCard">
    <div class="grip"></div>

    <div id="sheetTodo" class="pane hidden">
      <h2 id="todoTitle">할 일 추가</h2>
      <form id="todoForm" autocomplete="off">
        <div class="field">
          <input id="tdText" type="text" maxlength="120" placeholder="무엇을 할까요?" aria-label="할 일 내용">
        </div>
        <div class="field">
          <label>담당</label>
          <div class="owner-seg" id="tdOwner">
            <button type="button" data-owner="seeun"><i style="background:#9B7BE8"></i>세은</button>
            <button type="button" data-owner="chankyu"><i style="background:#6BA5E8"></i>찬규</button>
            <button type="button" data-owner="both"><i style="background:#4FBF95"></i>같이</button>
          </div>
        </div>
        <div class="field">
          <label>분류</label>
          <div class="cat-seg" id="tdCat">
            <button type="button" data-cat="wedding">결혼·신혼</button>
            <button type="button" data-cat="house">집안일</button>
            <button type="button" data-cat="grocery">장보기</button>
            <button type="button" data-cat="etc">기타</button>
          </div>
        </div>
        <div class="grid2">
          <div class="field" style="margin:0">
            <label>마감일 (선택)</label>
            <input id="tdDue" type="date" aria-label="마감일">
          </div>
          <div class="field" style="margin:0">
            <label>중요</label>
            <button type="button" id="tdStar" class="star-toggle" data-act="toggle-star">☆ 별표</button>
          </div>
        </div>
        <div class="field" style="margin-top:14px">
          <label>메모 (선택)</label>
          <textarea id="tdMemo" maxlength="400" placeholder="간단한 메모"></textarea>
        </div>
        <div class="sheet-actions">
          <button type="button" id="tdDelete" class="danger hidden" data-act="delete-todo" aria-label="삭제">삭제</button>
          <button type="submit" class="primary">저장</button>
        </div>
      </form>
    </div>

    <div id="sheetEvent" class="pane hidden">
      <h2 id="evTitle">일정 추가</h2>
      <form id="eventForm" autocomplete="off">
        <div class="field">
          <input id="evTitleInput" type="text" maxlength="120" placeholder="일정 이름" aria-label="일정 이름">
        </div>
        <div class="field">
          <label>날짜</label>
          <input id="evDate" type="date" aria-label="날짜">
        </div>
        <div class="checkline">
          <input id="evAllDay" type="checkbox">
          <label for="evAllDay">종일 일정</label>
        </div>
        <div class="grid2" id="evTimes">
          <div class="field" style="margin:0">
            <label>시작</label>
            <input id="evStart" type="time" aria-label="시작 시간">
          </div>
          <div class="field" style="margin:0">
            <label>종료</label>
            <input id="evEnd" type="time" aria-label="종료 시간">
          </div>
        </div>
        <div class="field" style="margin-top:14px">
          <label>담당</label>
          <div class="owner-seg" id="evOwner">
            <button type="button" data-owner="seeun"><i style="background:#9B7BE8"></i>세은</button>
            <button type="button" data-owner="chankyu"><i style="background:#6BA5E8"></i>찬규</button>
            <button type="button" data-owner="both"><i style="background:#4FBF95"></i>같이</button>
          </div>
        </div>
        <div class="field">
          <label>장소 (선택)</label>
          <input id="evPlace" type="text" maxlength="80" placeholder="예: 예식장 · 마트">
        </div>
        <div class="field">
          <label>메모 (선택)</label>
          <textarea id="evMemo" maxlength="400" placeholder="준비물이나 참고할 내용"></textarea>
        </div>
        <div class="sheet-actions">
          <button type="button" id="evDelete" class="danger hidden" data-act="delete-event" aria-label="삭제">삭제</button>

    <div id="sheetNw" class="pane hidden">
      <h2>순자산 업데이트</h2>
      <form id="nwForm" autocomplete="off">
        <div class="field">
          <label>금액 단위</label>
          <div class="seg unit-seg" id="nwUnit">
            <button type="button" data-unit="10000" class="on">만원</button>
            <button type="button" data-unit="1">원</button>
          </div>
        </div>
        <div class="npf">
          <div class="npf-head"><span class="tag seeun">세은</span></div>
          <div class="grid2">
            <div class="field" style="margin:0">
              <label>자산</label>
              <input id="nwSeeunAssets" type="number" inputmode="numeric" min="0" step="any" placeholder="0" aria-label="세은 자산">
            </div>
            <div class="field" style="margin:0">
              <label>부채</label>
              <input id="nwSeeunDebt" type="number" inputmode="numeric" min="0" step="any" placeholder="0" aria-label="세은 부채">
            </div>
          </div>
        </div>
        <div class="npf">
          <div class="npf-head"><span class="tag chankyu">찬규</span></div>
          <div class="grid2">
            <div class="field" style="margin:0">
              <label>자산</label>
              <input id="nwChankyuAssets" type="number" inputmode="numeric" min="0" step="any" placeholder="0" aria-label="찬규 자산">
            </div>
            <div class="field" style="margin:0">
              <label>부채</label>
              <input id="nwChankyuDebt" type="number" inputmode="numeric" min="0" step="any" placeholder="0" aria-label="찬규 부채">
            </div>
          </div>
        </div>
        <div class="field">
          <label>기준일</label>

          <input id="nwNote" type="text" maxlength="80" placeholder="예: 11월 정기 업데이트" aria-label="메모">

        <div class="sheet-actions">
          <button type="submit" class="primary">저장</button>
        </div>
      </form>
    </div>

  </div>

<script>
'use strict';
const DB = 'https://bubulife-678ac-default-rtdb.firebaseio.com';
const ROOM_RE = /^[A-Za-z0-9_-]{8,64}$/;

const OWNERS = {
  seeun:   { name: '세은', color: '#9B7BE8' },
  chankyu: { name: '찬규', color: '#6BA5E8' },
  both:    { name: '같이', color: '#4FBF95' }
};
const CATS = {
  wedding: { name: '결혼·신혼', emoji: '💍' },
  house:   { name: '집안일',   emoji: '🧺' },
  grocery: { name: '장보기',   emoji: '🛒' },
  etc:     { name: '기타',     emoji: '📌' }
};
const WD = ['일','월','화','수','목','금','토'];

const params = new URLSearchParams(location.search);
let ROOM = (params.get('room') || '').trim();
if (!ROOM_RE.test(ROOM)) {
  const saved = localStorage.getItem('bubu.room') || '';
  ROOM = ROOM_RE.test(saved) ? saved : '';
}

const ST = { todos: {}, events: {}, networth: {} };
const ui = {
  view: 'todos', owner: 'all', status: 'all', doneOpen: false,
  calMode: 'month', cursor: '', selected: '', live: 'connecting', installEvt: null
};
let draft = { kind: null, id: null, owner: 'both', cat: 'etc', important: false, unit: 10000 };
let es = null, retry = 0, pollTimer = null, gotSnapshot = false;

/* ---------------- utils ---------------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const pad = n => String(n).padStart(2, '0');

function isoOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function todayISO() { return isoOf(new Date()); }
function parseISO(s) { const p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function addDays(d, n) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; }
function iso3(s) { const p = s.split('-').map(Number); return [p[0], p[1] - 1, p[2]]; }
function diffDays(target) {
  const a = Date.UTC(...iso3(target)), b = Date.UTC(...iso3(todayISO()));
  return Math.round((a - b) / 86400000);
}
function fmtDay(s, withYear) {
  const d = parseISO(s);
  return (withYear ? d.getFullYear() + '년 ' : '') + (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + WD[d.getDay()] + ')';
}
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function num(n) { return Math.round(n || 0).toLocaleString('ko-KR'); }
function koreanWon(n) {
  const neg = n < 0; n = Math.abs(Math.round(n || 0));
  const eok = Math.floor(n / 1e8), man = Math.floor((n % 1e8) / 1e4), won = n % 1e4;
  const parts = [];
  if (eok) parts.push(num(eok) + '억');
  if (man) parts.push(num(man) + '만');
  if (won || !parts.length) parts.push(num(won));
  return (neg ? '-' : '') + parts.join(' ') + (won === 0 && n > 0 ? ' 원' : '원');
}
function koreanShort(n) {
  const neg = n < 0; n = Math.abs(Math.round(n || 0));
  const eok = Math.floor(n / 1e8), man = Math.floor((n % 1e8) / 1e4), won = n % 1e4;
  const parts = [];
  if (eok) parts.push(num(eok) + '억');
  if (man) parts.push(num(man) + '만');
  if (won || !parts.length) parts.push(num(won));
  return (neg ? '-' : '') + parts.join(' ');
}
function newId(prefix) { return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function objEntries(o) { return Object.entries(o || {}).filter(([, v]) => v && typeof v === 'object'); }
function toast(msg) {
  const old = $('.toast'); if (old) old.remove();
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.remove(), 2400);
}

/* ---------------- data helpers ---------------- */
function todoList() { return objEntries(ST.todos).map(([id, t]) => ({ id, ...t })); }
function eventList() { return objEntries(ST.events).map(([id, e]) => ({ id, ...e })); }
function todoSort(a, b) {
  const ad = a.due || '9999-99-99', bd = b.due || '9999-99-99';
  if (ad !== bd) return ad < bd ? -1 : 1;
  if (!!b.important !== !!a.important) return b.important ? 1 : -1;
  return (a.createdAt || 0) - (b.createdAt || 0);
}
function upcomingTodos() { return todoList().filter(t => !t.done).sort(todoSort); }
function doneTodos() { return todoList().filter(t => t.done).sort((a, b) => (b.doneAt || b.updatedAt || 0) - (a.doneAt || a.updatedAt || 0)); }
function eventsOf(date) {
  return eventList().filter(e => e.date === date)
    .sort((a, b) => (a.allDay ? 0 : 1) - (b.allDay ? 0 : 1) || String(a.start || '').localeCompare(String(b.start || '')));
}
function todosDueOf(date) { return todoList().filter(t => t.due === date).sort(todoSort); }
function eventsMap() {
  const m = {};
  eventList().forEach(e => { if (e.date) (m[e.date] = m[e.date] || []).push(e); });
  return m;
}
function dueBadge(t) {
  if (!t.due) return '';
  const d = diffDays(t.due);
  if (d === 0) return `<span class="tag due today">오늘</span>`;
  if (d < 0) return `<span class="tag due late">${Math.abs(d)}일 지남</span>`;
  if (d <= 7) return `<span class="tag due">D-${d}</span>`;
  const p = parseISO(t.due);
  return `<span class="tag due">${p.getMonth() + 1}/${p.getDate()}</span>`;
}

/* ---------------- render ---------------- */
function applyView() {
  $('#view-todos').classList.toggle('hidden', ui.view !== 'todos');
  $('#view-cal').classList.toggle('hidden', ui.view !== 'cal');
  $('#view-nw').classList.toggle('hidden', ui.view !== 'nw');
  $$('.tabs .tab').forEach(b => b.classList.toggle('is-on', b.dataset.view === ui.view));
  $('#fab').textContent = ui.view === 'cal' ? '＋ 일정 추가' : ui.view === 'nw' ? '＋ 순자산 업데이트' : '＋ 할 일 추가';
}
function renderAll() { renderHero(); renderTodos(); renderCal(); renderNetworth(); applyView(); }

function renderHero() {
  const t = todayISO();
  const d = parseISO(t);
  $('#todayLabel').textContent = `${d.getMonth() + 1}월 ${d.getDate()}일 ${WD[d.getDay()]}요일`;

  const dueToday = todoList().filter(x => !x.done && x.due && x.due <= t).length;
  const evs = eventsOf(t);
  const line = [];
  line.push(dueToday ? `오늘 할 일 <b>${dueToday}개</b>` : '오늘 마감 할 일 없음');
  line.push(evs.length ? `일정 <b>${evs.length}개</b>` : '일정 없음');
  $('#heroLine').innerHTML = line.join(' · ');
  $('#tabCount').textContent = todoList().filter(x => !x.done).length;

  $('#heroEvents').innerHTML = evs.length ? evs.slice(0, 3).map(e => {
    const o = OWNERS[e.owner] || OWNERS.both;
    return `<div class="hev"><i style="background:${o.color}"></i><b>${esc(e.allDay ? '종일' : (e.start || '—'))}</b><span>${esc(e.title)}</span></div>`;
  }).join('') + (evs.length > 3 ? `<div class="hev"><i style="background:transparent"></i><b></b><span>+${evs.length - 3}개 더</span></div>` : '') : '';
}

function ownerOK(t) { return ui.owner === 'all' || t.owner === ui.owner; }

function todoCard(t) {
  const o = OWNERS[t.owner] || OWNERS.both;
  const c = CATS[t.cat] || CATS.etc;
  return `<li class="todo ${t.done ? 'is-done' : ''}" data-id="${t.id}">
    <button class="check" data-act="toggle" data-id="${t.id}" aria-label="${t.done ? '완료 취소' : '완료 표시'}">
      <svg viewBox="0 0 24 24" width="14" height="14"><path d="M5 12.6l4.3 4.3L19 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="todo-main" data-act="edit-todo" data-id="${t.id}">
      <div class="todo-title">${esc(t.text)}</div>
      <div class="todo-meta">
        <span class="tag ${t.owner}">${o.name}</span>
        <span class="tag cat">${c.name}</span>
        ${dueBadge(t)}
      </div>
      ${t.memo ? `<div class="todo-memo">${esc(t.memo)}</div>` : ''}
    </div>
    <button class="star ${t.important ? 'on' : ''}" data-act="star" data-id="${t.id}" aria-label="중요 표시">★</button>
  </li>`;
}

function renderTodos() {
  const active = upcomingTodos().filter(ownerOK);
  const done = doneTodos().filter(ownerOK);
  const showDone = ui.status === 'all' || ui.status === 'done';
  const showActive = ui.status === 'all' || ui.status === 'active';

  const a = $('#todoActive');
  if (showActive) {
    a.innerHTML = active.length ? active.map(todoCard).join('')
      : `<li class="empty"><span class="big">🌱</span>${ui.owner === 'all' ? '아직 할 일이 없어요.' : '이 담당의 할 일이 없어요.'}</li>`;
  } else { a.innerHTML = ''; }

  $('#doneWrap').classList.toggle('hidden', !showDone);
  $('#doneCount').textContent = done.length;
  const doneOpen = ui.doneOpen || ui.status === 'done';
  $('#doneHead').classList.toggle('open', doneOpen);
  const dw = $('#todoDone');
  dw.classList.toggle('hidden', !doneOpen);
  dw.innerHTML = doneOpen
    ? (done.length ? done.map(todoCard).join('') : `<li class="empty" style="padding:22px"><span class="big">☑️</span>완료한 일이 아직 없어요.</li>`)
    : '';

  $$('#ownerFilter .chip').forEach(b => b.classList.toggle('on', b.dataset.owner === ui.owner));
  $$('#statusFilter .chip').forEach(b => b.classList.toggle('on', b.dataset.status === ui.status));
}

function renderCal() {
  $$('#calMode button').forEach(b => b.classList.toggle('on', b.dataset.mode === ui.calMode));
  if (ui.calMode === 'month') renderMonth();
  else if (ui.calMode === 'week') renderWeek();
  else renderDay();
}

function renderMonth() {
  const c = parseISO(ui.cursor);
  const y = c.getFullYear(), m = c.getMonth();
  const first = new Date(y, m, 1);
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const total = Math.ceil((first.getDay() + daysInMonth) / 7) * 7;
  const start = addDays(first, -first.getDay());
  const emap = eventsMap();
  const t = todayISO();

  $('#calTitle').textContent = `${y}년 ${m + 1}월`;

  let cells = '';
  for (let i = 0; i < total; i++) {
    const d = addDays(start, i);
    const ds = isoOf(d);
    const evs = emap[ds] || [];
    const dueN = todosDueOf(ds).filter(x => !x.done).length;
    const cls = ['cell'];
    if (d.getMonth() !== m) cls.push('out');
    if (ds === t) cls.push('today');
    if (ds === ui.selected) cls.push('sel');
    if (d.getDay() === 0) cls.push('sun');
    if (d.getDay() === 6) cls.push('sat');
    const dots = evs.slice(0, 3).map(e => `<i style="background:${(OWNERS[e.owner] || OWNERS.both).color}"></i>`).join('')
      + (evs.length > 3 ? `<i class="more">+${evs.length - 3}</i>` : '');
    cells += `<button class="${cls.join(' ')}" data-act="pick" data-date="${ds}" aria-label="${fmtDay(ds)}">
      <span class="dnum">${d.getDate()}</span>
      <span class="cdots">${dots}</span>
      ${dueN ? '<span class="tbar"></span>' : ''}
    </button>`;
  }

  $('#calBody').innerHTML = `
    <div class="month">
      <div class="wd-row">${WD.map(w => `<span>${w}</span>`).join('')}</div>
      <div class="grid">${cells}</div>
    </div>
    <div class="legend">
      <span><i style="background:${OWNERS.seeun.color}"></i>세은</span>
      <span><i style="background:${OWNERS.chankyu.color}"></i>찬규</span>
      <span><i style="background:${OWNERS.both.color}"></i>같이</span>
      <span><i style="background:#C9BFA6;border-radius:1px"></i>마감 할 일</span>
    </div>`;
  $('#calPanel').innerHTML = dayPanel(ui.selected);
}

function dayPanel(ds, noHead) {
  const evs = eventsOf(ds);
  const td = todosDueOf(ds);
  const isToday = ds === todayISO();

  const evHtml = evs.length ? evs.map(e => {
    const o = OWNERS[e.owner] || OWNERS.both;
    return `<div class="ev" data-act="edit-event" data-id="${e.id}">
      <div class="ev-time ${e.allDay ? 'allday' : ''}">${esc(e.allDay ? '종일' : (e.start || '—'))}</div>
      <div class="ev-body">
        <div class="ev-title"><i style="background:${o.color}"></i>${esc(e.title)}</div>
        <div class="ev-sub">
          <span>${o.name}</span>
          ${e.place ? `<span>${esc(e.place)}</span>` : ''}
          ${!e.allDay && e.end ? `<span>~ ${esc(e.end)}</span>` : ''}
        </div>
        ${e.memo ? `<div class="ev-sub" style="margin-top:4px">${esc(e.memo)}</div>` : ''}
      </div>
    </div>`;
  }).join('') : `<div class="empty-line">일정이 없어요</div>`;

  const tdHtml = td.length ? td.map(t => `
    <div class="mini ${t.done ? 'done' : ''}" data-act="toggle" data-id="${t.id}">
      <span class="mini-check"><svg viewBox="0 0 24 24" width="11" height="11"><path d="M5 12.6l4.3 4.3L19 7" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="mt">${esc(t.text)}</span>
      <span class="tag ${t.owner}">${(OWNERS[t.owner] || OWNERS.both).name}</span>
    </div>`).join('') : `<div class="empty-line">이 날 마감인 할 일이 없어요</div>`;

  return `<div class="panel">
    ${noHead ? '' : `<div class="panel-head"><b>${fmtDay(ds)}</b>${isToday ? '<span class="pill">오늘</span>' : ''}</div>`}
    <div class="sec-label">일정</div>
    ${evHtml}
    <div class="sec-label">마감 할 일</div>
    ${tdHtml}
    <div class="panel-actions">
      <button class="ghost" data-act="add-event" data-date="${ds}">＋ 일정</button>
      <button class="ghost" data-act="add-todo" data-date="${ds}">＋ 할 일</button>
    </div>
  </div>`;
}

function renderWeek() {
  const c = parseISO(ui.cursor);
  const start = addDays(c, -c.getDay());
  const end = addDays(start, 6);
  const t = todayISO();
  $('#calTitle').textContent = start.getMonth() !== end.getMonth()
    ? `${start.getMonth() + 1}/${start.getDate()} – ${end.getMonth() + 1}/${end.getDate()}`
    : `${start.getMonth() + 1}월 ${start.getDate()}–${end.getDate()}일`;

  let rows = '';
  for (let i = 0; i < 7; i++) {
    const d = addDays(start, i);
    const ds = isoOf(d);
    const evs = eventsOf(ds);
    const dueN = todosDueOf(ds).filter(x => !x.done).length;
    const cls = ['wk'];
    if (ds === t) cls.push('today');
    if (d.getDay() === 0) cls.push('sun');
    if (d.getDay() === 6) cls.push('sat');
    const body = (evs.length ? evs.slice(0, 3).map(e => {
      const o = OWNERS[e.owner] || OWNERS.both;
      return `<div class="wk-ev"><i style="background:${o.color}"></i><span class="t">${esc(e.allDay ? '종일' : (e.start || '—'))}</span><span class="tt">${esc(e.title)}</span></div>`;
    }).join('') : `<div class="wk-none">일정 없음</div>`)
      + (evs.length > 3 ? `<div class="wk-none">+${evs.length - 3}개 더</div>` : '')
      + (dueN ? `<div class="wk-todo">마감 할 일 ${dueN}</div>` : '');
    rows += `<button class="${cls.join(' ')}" data-act="open-day" data-date="${ds}">
      <div class="wk-date"><span class="wd">${WD[d.getDay()]}</span><span class="dn">${d.getDate()}</span></div>
      <div class="wk-body">${body}</div>
    </button>`;
  }
  $('#calBody').innerHTML = `<div class="week">${rows}</div>`;
  $('#calPanel').innerHTML = '';
}

function renderDay() {
  const ds = ui.cursor;
  const d = parseISO(ds);
  $('#calTitle').textContent = `${d.getMonth() + 1}월 ${d.getDate()}일`;
  $('#calBody').innerHTML = `
    <div class="day-big"><span class="dd">${d.getDate()}</span><span class="dw">${d.getMonth() + 1}월 · ${WD[d.getDay()]}요일</span>
      ${ds === todayISO() ? '<span class="pill">오늘</span>' : ''}</div>`;
  $('#calPanel').innerHTML = dayPanel(ds, true);
}

/* ---------------- net worth ---------------- */
function nwData() {
  const nw = ST.networth || {};
  return { current: nw.current || null, history: nw.history || {} };
}

function renderNetworth() {
  const { current, history } = nwData();
  const hist = objEntries(history).map(([k, v]) => ({ key: k, ...v })).sort((a, b) => a.key < b.key ? 1 : -1);
  const box = $('#nwBody');

  if (!current) {
    box.innerHTML = `
      <div class="nw-card">
        <div class="nw-eyebrow">부부 순자산</div>
        <div class="nw-amount" style="color:#B4AEA2;font-size:23px;letter-spacing:-.6px">업데이트 대기 중</div>
        <div class="nw-note">엑셀 파일을 보내주시면 제가 읽어서 세은·찬규 순자산을 채워 둘게요.<br>직접 고치셔도 됩니다.</div>
        <div class="nw-actions"><button class="nw-btn" data-act="edit-nw">순자산 입력하기</button></div>
      </div>`;
    return;
  }

  const net = Number(current.netWorth || 0);
  const assets = Number(current.totalAssets || 0);
  const debt = Number(current.totalDebt || 0);
  const person = (key) => {
    const p = current[key];
    if (!p) return null;
    const a = Number(p.assets || 0), d = Number(p.debt || 0);
    return { a, d, net: Number(p.net != null ? p.net : a - d) };
  };
  const s = person('seeun'), c = person('chankyu');

  const rows = hist.length > 1 ? (() => {
    const asc = hist.slice().reverse();
    const maxAbs = Math.max(...asc.map(h => Math.abs(Number(h.netWorth || 0))), 1);
    return asc.map((h, i) => {
      const prev = i > 0 ? Number(asc[i - 1].netWorth || 0) : null;
      const diff = prev === null ? null : Number(h.netWorth || 0) - prev;
      const [yy, mm] = h.key.split('-');
      const w = Math.max(4, Math.round(Math.abs(Number(h.netWorth || 0)) / maxAbs * 100));
      return `<div class="hist">
        <span class="hm">${yy.slice(2)}년 ${Number(mm)}월</span>
        <span class="hwrap"><span class="hbar"><i style="width:${w}%"></i></span></span>
        <span class="hv">${koreanShort(Number(h.netWorth || 0))}</span>
        <span class="hd ${diff > 0 ? 'up' : diff < 0 ? 'down' : ''}">${diff === null ? '' : (diff > 0 ? '▲' : diff < 0 ? '▼' : '–') + (diff === 0 ? '' : koreanShort(Math.abs(diff)))}</span>
      </div>`;
    }).reverse().join('');
  })() : '';

  const personCard = (key, label) => {
    const p = key === 'seeun' ? s : c;
    if (!p) return '';
    return `<div class="nw-person ${key}">
      <div class="np-head"><span class="np-name">${label}</span></div>
      <div class="np-net ${p.net < 0 ? 'neg' : ''}">${koreanShort(p.net)}</div>
      <div class="np-split">자산 ${koreanWon(p.a)}<br>부채 ${koreanWon(p.d)}</div>
    </div>`;
  };

  box.innerHTML = `
    <div class="nw-card">
      <div class="nw-eyebrow">부부 순자산</div>
      <div class="nw-amount ${net < 0 ? 'neg' : ''}">${koreanShort(net)}<small>원</small></div>
      <div class="nw-raw">${num(net)}원</div>
      <div class="nw-split">
        <div><span>총 자산</span><b>${koreanWon(assets)}</b></div>
        <div><span>총 부채</span><b>${koreanWon(debt)}</b></div>
      </div>
      <div class="nw-meta"><span>${current.asOf ? current.asOf + ' 기준' : '기준일 없음'}</span></div>
      ${current.note ? `<div class="nw-note">${esc(current.note)}</div>` : ''}
      <div class="nw-actions"><button class="nw-btn" data-act="edit-nw">순자산 수정</button></div>
    </div>
    ${(s || c) ? `<div class="nw-people">${personCard('seeun', '세은')}${personCard('chankyu', '찬규')}</div>` : ''}
    ${hist.length > 1 ? `<div class="panel"><div class="panel-head"><b>월별 추이</b></div>${rows}</div>` : ''}`;
}

function openNwSheet() {
  const { current } = nwData();
  draft = { kind: 'nw', id: null, owner: 'both', cat: 'etc', important: false, unit: 10000 };
  const sA = current && current.seeun ? Number(current.seeun.assets || 0) : 0;
  const sD = current && current.seeun ? Number(current.seeun.debt || 0) : 0;
  const cA = current && current.chankyu ? Number(current.chankyu.assets || 0) : 0;
  const cD = current && current.chankyu ? Number(current.chankyu.debt || 0) : 0;
  const all = [sA, sD, cA, cD];
  const useMan = all.every(v => v % 10000 === 0);
  draft.unit = useMan ? 10000 : 1;
  const conv = v => v ? String(useMan ? v / 10000 : v) : '';
  $('#nwSeeunAssets').value = conv(sA);
  $('#nwSeeunDebt').value = conv(sD);
  $('#nwChankyuAssets').value = conv(cA);
  $('#nwChankyuDebt').value = conv(cD);
  $('#nwAsOf').value = current && current.asOf ? current.asOf : todayISO();
  $('#nwNote').value = current && current.note ? current.note : '';
  $$('#nwUnit button').forEach(b => b.classList.toggle('on', Number(b.dataset.unit) === draft.unit));
  syncNwCalc();
  showPane('sheetNw');
}

function syncNwCalc() {
  const u = draft.unit;
  const sA = Number($('#nwSeeunAssets').value || 0) * u;
  const sD = Number($('#nwSeeunDebt').value || 0) * u;
  const cA = Number($('#nwChankyuAssets').value || 0) * u;
  const cD = Number($('#nwChankyuDebt').value || 0) * u;
  $('#nwCalc').innerHTML = `부부 순자산 <b>${koreanWon((sA - sD) + (cA - cD))}</b>`
    + `<span class="sub">세은 ${koreanShort(sA - sD)} · 찬규 ${koreanShort(cA - cD)}</span>`;
}

async function saveNetworth() {
  const u = draft.unit;
  const sA = Math.round(Number($('#nwSeeunAssets').value || 0) * u);
  const sD = Math.round(Number($('#nwSeeunDebt').value || 0) * u);
  const cA = Math.round(Number($('#nwChankyuAssets').value || 0) * u);
  const cD = Math.round(Number($('#nwChankyuDebt').value || 0) * u);
  if (!sA && !sD && !cA && !cD) { toast('세은·찬규의 자산과 부채를 입력해 주세요'); return; }
  const asOf = $('#nwAsOf').value || todayISO();
  const note = $('#nwNote').value.trim();
  const now = Date.now();
  const cur = {
    seeun: { assets: sA, debt: sD, net: sA - sD },
    chankyu: { assets: cA, debt: cD, net: cA - cD },
    totalAssets: sA + cA,
    totalDebt: sD + cD,
    netWorth: (sA - sD) + (cA - cD),
    asOf, note, updatedAt: now
  };
  const key = asOf.slice(0, 7);

  ST.networth = ST.networth || {};
  ST.networth.current = cur;
  ST.networth.history = ST.networth.history || {};
  ST.networth.history[key] = { ...cur };

  closeSheet(); renderAll();
  try {
    await put('networth/current', cur);
    await put('networth/history/' + key, { ...cur });
    toast('순자산을 저장했어요');
  } catch (e) { toast('저장하지 못했어요 · 연결 확인'); syncNow(true); }
}

function setView(v) {
  ui.view = v;
  applyView(); renderCal(); renderNetworth();

function calStep(dir) {
  const c = parseISO(ui.cursor);
  if (ui.calMode === 'month') {
    const n = new Date(c.getFullYear(), c.getMonth() + dir, 1);
    ui.cursor = isoOf(n);
    const s = parseISO(ui.selected);
    if (s.getFullYear() !== n.getFullYear() || s.getMonth() !== n.getMonth()) ui.selected = isoOf(n);
  } else if (ui.calMode === 'week') {
    ui.cursor = isoOf(addDays(c, dir * 7));
  } else {
    ui.cursor = isoOf(addDays(c, dir));
    ui.selected = ui.cursor;
  }
  renderCal();
}

/* ---------------- realtime (Firebase RTDB REST + SSE) ---------------- */
const roomUrl = () => `${DB}/rooms/${ROOM}.json`;
const nodeUrl = p => `${DB}/rooms/${ROOM}/${p}.json`;

function setLive(state) {
  ui.live = state;
  const el = $('#conn'); if (!el) return;
  el.className = 'conn ' + state;
  el.querySelector('span').textContent =
    state === 'live' ? '실시간 연결됨' : state === 'warn' ? '다시 연결 중' : state === 'off' ? '오프라인' : '연결 중';
}

function boot() {
  renderAll();
  connect();
  setInterval(() => { if (ui.live !== 'live') syncNow(true); }, 15000);
  setInterval(() => { checkReminders(); }, 60000);
  setInterval(() => {
    if (ui._day !== todayISO()) { ui._day = todayISO(); ui.selected = todayISO(); ui.cursor = todayISO(); renderAll(); }
  }, 30000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { renderAll(); if (ui.live !== 'live') syncNow(true); }
  });
  registerSW();
  updateBell();
}

function connect() {
  if (es) { es.close(); es = null; }
  setLive(retry ? 'warn' : 'connecting');
  try { es = new EventSource(roomUrl()); } catch (e) { setLive('off'); return; }

  es.addEventListener('put', ev => {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.path === '/') {
      ST.todos = (m.data && m.data.todos) || {};
      ST.events = (m.data && m.data.events) || {};
      ST.networth = (m.data && m.data.networth) || {};
      gotSnapshot = true;
    } else { setAt(m.path, m.data); }
    retry = 0; setLive('live'); stopPolling(); renderAll();
  });
  es.addEventListener('patch', ev => {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    Object.entries(m.data || {}).forEach(([k, v]) => setAt((m.path === '/' ? '' : m.path) + '/' + k, v));
    gotSnapshot = true; setLive('live'); renderAll();
  });
  es.addEventListener('cancel', () => { setLive('warn'); reconnect(); });
  es.addEventListener('auth_revoked', () => { setLive('off'); });
  es.onopen = () => { retry = 0; setLive('live'); stopPolling(); if (!gotSnapshot) syncNow(); };
  es.onerror = () => {
    setLive(navigator.onLine ? 'warn' : 'off');
    reconnect(); startPolling();
  };
}

function reconnect() {
  if (es) { try { es.close(); } catch (e) {} es = null; }
  retry = Math.min(retry + 1, 6);
  const wait = Math.min(1000 * Math.pow(1.7, retry), 15000);
  setTimeout(() => { if (!es) connect(); }, wait);
}

function setAt(path, data) {
  const segs = path.split('/').filter(Boolean);
  if (!segs.length) {
    ST.todos = (data && data.todos) || {};
    ST.events = (data && data.events) || {};
    ST.networth = (data && data.networth) || {};
    return;
  }
  let obj = ST;
  for (let i = 0; i < segs.length - 1; i++) {
    if (!obj[segs[i]] || typeof obj[segs[i]] !== 'object') obj[segs[i]] = {};
    obj = obj[segs[i]];
  }
  const last = segs[segs.length - 1];
  if (data === null || data === undefined) delete obj[last];
  else obj[last] = data;
}

function startPolling() {
  if (pollTimer) return;
  pollTimer = setInterval(() => { if (ui.live !== 'live') syncNow(true); }, 8000);
}
function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

async function syncNow(quiet) {
  try {
    const r = await fetch(roomUrl(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = (await r.json()) || {};
    ST.todos = d.todos || {};
    ST.events = d.events || {};
    ST.networth = d.networth || {};
    gotSnapshot = true;
    if (ui.live !== 'live') setLive('live');
    renderAll(); stopPolling();
  } catch (e) {
    if (!quiet) toast('연결을 확인해 주세요');
    setLive(navigator.onLine ? 'warn' : 'off');
  }
}

async function put(path, val) {
  const r = await fetch(nodeUrl(path), { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(val) });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function patch(path, val) {
  const r = await fetch(nodeUrl(path), { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(val) });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
async function del(path) {
  const r = await fetch(nodeUrl(path), { method: 'DELETE' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return true;
}

/* ---------------- todo / event forms ---------------- */
function openTodoSheet(id, date) {
  draft = { kind: 'todo', id: id || null, owner: 'both', cat: 'etc', important: false, unit: 10000 };
  const t = id ? ST.todos[id] : null;
  if (t) { draft.owner = t.owner || 'both'; draft.cat = t.cat || 'etc'; draft.important = !!t.important; }
  $('#todoTitle').textContent = t ? '할 일 수정' : '할 일 추가';
  $('#tdText').value = t ? (t.text || '') : '';
  $('#tdDue').value = t ? (t.due || '') : (date || '');
  $('#tdMemo').value = t ? (t.memo || '') : '';
  $('#tdDelete').classList.toggle('hidden', !t);
  syncOwnerSeg('#tdOwner', draft.owner);
  $$('#tdCat button').forEach(b => b.classList.toggle('on', b.dataset.cat === draft.cat));
  syncStar();
  showPane('sheetTodo');
  setTimeout(() => { if (!t) $('#tdText').focus(); }, 250);
}

function syncOwnerSeg(sel, owner) { $$(sel + ' button').forEach(b => b.classList.toggle('on', b.dataset.owner === owner)); }
function syncStar() {
  const b = $('#tdStar');
  b.classList.toggle('on', draft.important);
  b.textContent = draft.important ? '★ 중요' : '☆ 별표';
}

async function saveTodo() {
  const text = $('#tdText').value.trim();
  if (!text) { toast('할 일 내용을 적어 주세요'); $('#tdText').focus(); return; }
  const id = draft.id || newId('t-');
  const prev = ST.todos[id];
  const obj = {
    text,
    owner: draft.owner,
    cat: draft.cat,
    due: $('#tdDue').value || '',
    important: !!draft.important,
    memo: $('#tdMemo').value.trim(),
    done: prev ? !!prev.done : false,
    createdAt: prev && prev.createdAt ? prev.createdAt : Date.now(),
    updatedAt: Date.now()
  };
  if (prev && prev.doneAt) obj.doneAt = prev.doneAt;

  ST.todos[id] = obj;
  closeSheet(); renderAll();
  try { await put('todos/' + id, obj); toast(prev ? '수정했어요' : '할 일을 추가했어요'); }
  catch (e) { toast('저장하지 못했어요 · 연결 확인'); syncNow(true); }
}

async function toggleTodo(id) {
  const t = ST.todos[id]; if (!t) return;
  const done = !t.done;
  const upd = { done, doneAt: done ? Date.now() : null };
  Object.assign(t, upd); renderAll();
  try { await patch('todos/' + id, upd); }
  catch (e) { toast('저장하지 못했어요 · 연결 확인'); syncNow(true); }
}

async function starTodo(id) {
  const t = ST.todos[id]; if (!t) return;
  t.important = !t.important; t.updatedAt = Date.now(); renderAll();
  try { await patch('todos/' + id, { important: t.important, updatedAt: t.updatedAt }); }
  catch (e) { toast('저장하지 못했어요 · 연결 확인'); syncNow(true); }
}

async function deleteTodo(id) {
  if (!confirm('이 할 일을 삭제할까요?')) return;
  delete ST.todos[id]; closeSheet(); renderAll();
  try { await del('todos/' + id); toast('삭제했어요'); }
  catch (e) { toast('삭제하지 못했어요'); syncNow(true); }
}

function openEventSheet(id, date) {
  draft = { kind: 'event', id: id || null, owner: 'both', cat: 'etc', important: false, unit: 10000 };
  const e = id ? ST.events[id] : null;
  if (e) draft.owner = e.owner || 'both';
  $('#evTitle').textContent = e ? '일정 수정' : '일정 추가';
  $('#evTitleInput').value = e ? (e.title || '') : '';
  $('#evDate').value = e ? (e.date || '') : (date || todayISO());
  $('#evAllDay').checked = e ? !!e.allDay : false;
  $('#evStart').value = e ? (e.start || '') : '10:00';
  $('#evEnd').value = e ? (e.end || '') : '';
  $('#evPlace').value = e ? (e.place || '') : '';
  $('#evMemo').value = e ? (e.memo || '') : '';
  $('#evDelete').classList.toggle('hidden', !e);
  syncOwnerSeg('#evOwner', draft.owner);
  syncAllDay();
  showPane('sheetEvent');
  setTimeout(() => { if (!e) $('#evTitleInput').focus(); }, 250);
}

function syncAllDay() {
  const all = $('#evAllDay').checked;
  $('#evTimes').style.opacity = all ? '.45' : '1';
  $('#evStart').disabled = all;
  $('#evEnd').disabled = all;
}

async function saveEvent() {
  const title = $('#evTitleInput').value.trim();
  if (!title) { toast('일정 이름을 적어 주세요'); $('#evTitleInput').focus(); return; }
  const date = $('#evDate').value || todayISO();
  const allDay = $('#evAllDay').checked;
  const id = draft.id || newId('e-');
  const prev = ST.events[id];
  const obj = {
    title, date, allDay,
    start: allDay ? '' : ($('#evStart').value || ''),
    end: allDay ? '' : ($('#evEnd').value || ''),
    owner: draft.owner,
    place: $('#evPlace').value.trim(),
    memo: $('#evMemo').value.trim(),
    createdAt: prev && prev.createdAt ? prev.createdAt : Date.now(),
    updatedAt: Date.now()
  };
  ST.events[id] = obj;
  ui.cursor = date; ui.selected = date;
  closeSheet(); renderAll();
  try { await put('events/' + id, obj); toast(prev ? '수정했어요' : '일정을 추가했어요'); }
  catch (e) { toast('저장하지 못했어요 · 연결 확인'); syncNow(true); }
}

async function deleteEvent(id) {
  if (!confirm('이 일정을 삭제할까요?')) return;
  delete ST.events[id]; closeSheet(); renderAll();
  try { await del('events/' + id); toast('삭제했어요'); }
  catch (e) { toast('삭제하지 못했어요'); syncNow(true); }
}

/* ---------------- sheet ---------------- */
function showPane(id) {
  ['sheetTodo', 'sheetEvent', 'sheetNw'].forEach(p => $('#' + p).classList.toggle('hidden', p !== id));
  $('#sheet').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}
function closeSheet() {
  $('#sheet').classList.add('hidden');
  document.body.style.overflow = '';
  draft = { kind: null, id: null, owner: 'both', cat: 'etc', important: false, unit: 10000 };
}

/* ---------------- notifications ---------------- */
function notifyOn() { return localStorage.getItem('bubu.notify') === '1'; }
function updateBell() {
  const on = notifyOn() && ('Notification' in window) && Notification.permission === 'granted';
  const b = $('#notifyBtn');
  b.classList.toggle('on', on);
  b.setAttribute('aria-label', on ? '알림 끄기' : '알림 켜기');
}
async function toggleNotify() {
  if (!('Notification' in window)) { toast('이 브라우저는 알림을 지원하지 않아요'); return; }
  if (notifyOn() && Notification.permission === 'granted') {
    localStorage.setItem('bubu.notify', '0'); updateBell(); toast('알림을 껐어요'); return;
  }
  let perm = Notification.permission;
  if (perm !== 'granted') perm = await Notification.requestPermission();
  if (perm === 'granted') {
    localStorage.setItem('bubu.notify', '1'); updateBell();
    toast('알림을 켰어요 · 오늘 일정과 마감 할 일을 알려드려요');
    checkReminders();
  } else { toast('브라우저 설정에서 알림을 허용해 주세요'); }
}
function showNotification(title, body) {
  const opts = { body, icon: './icon-192.png', badge: './icon-192.png', tag: title, lang: 'ko' };
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.ready) {
      navigator.serviceWorker.ready.then(reg => reg.showNotification(title, opts))
        .catch(() => { try { new Notification(title, opts); } catch (e) {} });
    } else { new Notification(title, opts); }
  } catch (e) {}
}
function checkReminders() {
  if (!notifyOn() || !('Notification' in window) || Notification.permission !== 'granted') return;
  const today = todayISO(), now = new Date();
  let sent = {};
  try { sent = JSON.parse(localStorage.getItem('bubu.sent') || '{}'); } catch (e) { sent = {}; }

  eventsOf(today).forEach(e => {
    if (e.allDay || !e.start) return;
    const [h, m] = e.start.split(':').map(Number);
    const st = new Date(); st.setHours(h, m, 0, 0);
    const mins = (st - now) / 60000;
    const key = `e:${e.id}:${today}`;
    if (mins >= -1 && mins <= 30 && !sent[key]) {
      sent[key] = 1;
      showNotification('곧 일정이 있어요 · ' + e.start, e.title + (e.place ? ' · ' + e.place : ''));
    }
  });

  const due = todoList().filter(t => !t.done && t.due && t.due <= today);
  if (now.getHours() >= 9 && due.length && !sent['td:' + today]) {
    sent['td:' + today] = 1;
    showNotification('오늘 마감 할 일 ' + due.length + '개', due.slice(0, 3).map(t => '· ' + t.text).join('\n'));
  }
  localStorage.setItem('bubu.sent', JSON.stringify(sent));
}

/* ---------------- PWA ---------------- */
function registerSW() {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
}
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); ui.installEvt = e; $('#installBtn').classList.remove('hidden');
});
window.addEventListener('appinstalled', () => { $('#installBtn').classList.add('hidden'); toast('홈 화면에 추가했어요'); });
async function installApp() {
  if (!ui.installEvt) { toast('브라우저 메뉴 ⋮ 에서 "홈 화면에 추가"를 눌러 주세요'); return; }
  ui.installEvt.prompt();
  try { await ui.installEvt.userChoice; } catch (e) {}
  ui.installEvt = null; $('#installBtn').classList.add('hidden');
}

/* ---------------- events ---------------- */
document.addEventListener('click', async (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;

  switch (act) {
    case 'view': setView(el.dataset.view); break;
    case 'filter-owner': ui.owner = el.dataset.owner; renderTodos(); break;
    case 'filter-status': ui.status = el.dataset.status; renderTodos(); break;
    case 'toggle-done-open': ui.doneOpen = !ui.doneOpen; renderTodos(); break;
    case 'toggle': ev.stopPropagation(); await toggleTodo(id); break;
    case 'star': ev.stopPropagation(); await starTodo(id); break;
    case 'edit-todo': openTodoSheet(id); break;
    case 'delete-todo': await deleteTodo(draft.id); break;
    case 'edit-event': openEventSheet(id); break;
    case 'delete-event': await deleteEvent(draft.id); break;
    case 'add-todo': openTodoSheet(null, el.dataset.date); break;
    case 'add-event': openEventSheet(null, el.dataset.date); break;
    case 'edit-nw': openNwSheet(); break;
    case 'pick': ui.selected = el.dataset.date; ui.cursor = el.dataset.date; renderMonth(); break;
    case 'open-day': ui.cursor = el.dataset.date; ui.selected = el.dataset.date; ui.calMode = 'day'; renderCal(); break;
    case 'cal-mode': ui.calMode = el.dataset.mode; renderCal(); break;
    case 'cal-prev': calStep(-1); break;
    case 'cal-next': calStep(1); break;
    case 'fab':
      if (ui.view === 'cal') openEventSheet(null, ui.calMode === 'month' ? ui.selected : ui.cursor);
      else if (ui.view === 'nw') openNwSheet();
      else openTodoSheet(null);
      break;
    case 'close-sheet': closeSheet(); break;
    case 'toggle-star': draft.important = !draft.important; syncStar(); break;
    case 'notify': await toggleNotify(); break;
    case 'install': await installApp(); break;
    case 'copy-link': {
      const link = location.origin + location.pathname + '?room=' + encodeURIComponent(ROOM);
      try { await navigator.clipboard.writeText(link); toast('링크를 복사했어요'); }
      catch (e) { prompt('아래 링크를 복사해 주세요', link); }
      break;
    }
  }
});

$('#tdOwner').addEventListener('click', e => {
  const b = e.target.closest('button[data-owner]'); if (!b) return;
  draft.owner = b.dataset.owner; syncOwnerSeg('#tdOwner', draft.owner);
});
$('#evOwner').addEventListener('click', e => {
  const b = e.target.closest('button[data-owner]'); if (!b) return;
  draft.owner = b.dataset.owner; syncOwnerSeg('#evOwner', draft.owner);
});
$('#tdCat').addEventListener('click', e => {
  const b = e.target.closest('button[data-cat]'); if (!b) return;
  draft.cat = b.dataset.cat;
  $$('#tdCat button').forEach(x => x.classList.toggle('on', x.dataset.cat === draft.cat));
});
$('#evAllDay').addEventListener('change', syncAllDay);

$('#nwUnit').addEventListener('click', e => {
  const b = e.target.closest('button[data-unit]'); if (!b) return;
  const next = Number(b.dataset.unit);
  if (next === draft.unit) return;
  const conv = (v) => {
    const n = Number(v || 0);
    if (!n) return '';
    return next === 10000 ? String(Math.round(n / 10000 * 100) / 100) : String(Math.round(n * 10000));
  };
  ['#nwSeeunAssets', '#nwSeeunDebt', '#nwChankyuAssets', '#nwChankyuDebt'].forEach(sel => { $(sel).value = conv($(sel).value); });
  draft.unit = next;
  $$('#nwUnit button').forEach(x => x.classList.toggle('on', Number(x.dataset.unit) === next));
  syncNwCalc();
});
['#nwSeeunAssets', '#nwSeeunDebt', '#nwChankyuAssets', '#nwChankyuDebt'].forEach(sel => $(sel).addEventListener('input', syncNwCalc));

$('#todoForm').addEventListener('submit', e => { e.preventDefault(); saveTodo(); });
$('#eventForm').addEventListener('submit', e => { e.preventDefault(); saveEvent(); });
$('#nwForm').addEventListener('submit', e => { e.preventDefault(); saveNetworth(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

/* ---------------- start ---------------- */
function initApp() {
  ui.cursor = ui.selected = todayISO();
  ui._day = todayISO();
  if (!ROOM) { $('#gate').classList.remove('hidden'); return; }
  localStorage.setItem('bubu.room', ROOM);
  $('#app').classList.remove('hidden');
  $('#fab').classList.remove('hidden');
  boot();
}
initApp();
</script>
